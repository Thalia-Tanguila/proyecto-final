<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unidad 1 — Temas</title>
    <link href="/styles.css" rel="stylesheet" />
  </head>
  <body>
    <main>
      <section class="content-section" data-unit="unidad1">
        <div class="section-heading">
          <span class="eyebrow">Unidad 1</span>
          <h2>Temas de la Unidad 1</h2>
          <p>Selecciona un tema para ver su contenido.</p>
        </div>

        <div class="toggle-group topics-toggle" aria-label="Ver temas">
          <button id="btn-topics-static-u1" class="toggle-btn active">Estática</button>
          <button id="btn-topics-dynamic-u1" class="toggle-btn">Dinámica</button>
        </div>

        <div id="topic-list-static-u1" class="topic-grid">
          <article class="tema-card">
            <div>
              <h3>Tema 1</h3>
              <p>Breve descripción del Tema 1.</p>
            </div>
            <div class="tema-actions">
              <a class="btn" href="tema1.html">Abrir</a>
            </div>
          </article>

          <article class="tema-card">
            <div>
              <h3>Tema 2</h3>
              <p>Breve descripción del Tema 2.</p>
            </div>
            <div class="tema-actions">
              <a class="btn" href="tema2.html">Abrir</a>
            </div>
          </article>

          <article class="tema-card">
            <div>
              <h3>Tema 3</h3>
              <p>Breve descripción del Tema 3.</p>
            </div>
            <div class="tema-actions">
              <a class="btn" href="tema3.html">Abrir</a>
            </div>
          </article>

          <!-- (Opcional) agregar más temas editando topicsData en script.js -->
        </div>

        <div id="topic-list-dynamic-u1" class="topic-grid hidden" aria-live="polite"></div>

        <div class="unit-actions">
          <a class="btn" href="/index.html">Volver al portafolio</a>
        </div>
      </section>
    </main>
  </body>
</html>
